[project]
name = "tavily-diligence"
version = "0.1.0"
description = "Grounded vendor security due-diligence agent built on Tavily"
requires-python = ">=3.11"
dependencies = [
    "tavily-python>=0.5.0",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "openinference-semantic-conventions>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "arize-phoenix>=5.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diligence"]

[tool.pytest.ini_options]
pythonpath = ["src"]
